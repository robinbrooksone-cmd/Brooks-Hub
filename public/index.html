<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ons Troue</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="hero" id="hero">
    <nav class="nav">
      <a href="#story">Ons Storie</a>
      <a href="#wedding-party">Bruidsparty</a>
      <a href="#details">Besonderhede</a>
      <a href="#attire">Kleredrag</a>
      <a href="#travel">Reis & Verblyf</a>
      <a href="#gallery">Galery</a>
      <a href="#registry">Geskenklys</a>
      <a href="#faq">Vrae</a>
      <a href="#rsvp" class="nav-rsvp">RSVP</a>
    </nav>
    <div class="hero-content">
      <img id="hero-photo" class="hero-photo" alt="" hidden />
      <h1 id="couple-names">Laai tans…</h1>
      <p id="wedding-date" class="hero-date"></p>
      <div id="countdown" class="countdown"></div>
      <p id="intro-message" class="hero-intro"></p>
      <a href="#rsvp" class="btn btn-primary">RSVP Nou</a>
    </div>
  </header>

  <main>
    <section id="story" class="section">
      <h2 id="story-heading">Ons Storie</h2>
      <div id="story-timeline" class="timeline"></div>
    </section>

    <section id="wedding-party" class="section alt">
      <h2>Bruidsparty</h2>
      <div id="wedding-party-columns" class="wedding-party-columns"></div>
    </section>

    <section id="details" class="section">
      <h2>Troubesonderhede</h2>
      <div id="schedule-list" class="schedule-list"></div>
    </section>

    <section id="attire" class="section alt">
      <h2 id="attire-heading">Wat om te Dra</h2>
      <div id="attire-content" class="attire-content"></div>
    </section>

    <section id="travel" class="section">
      <h2 id="travel-heading">Reis &amp; Verblyf</h2>
      <p id="travel-intro" class="section-intro"></p>
      <div id="accommodations-grid" class="card-grid"></div>
      <p id="transport-notes" class="section-note"></p>
    </section>

    <section id="gallery" class="section alt">
      <h2 id="gallery-heading">Galery</h2>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <section id="registry" class="section">
      <h2 id="registry-heading">Geskenklys</h2>
      <p id="registry-intro" class="section-intro"></p>
      <p id="registry-note" class="section-intro"></p>
      <div id="registry-bank-details" class="bank-card" hidden></div>
      <div id="registry-links" class="registry-links"></div>
    </section>

    <section id="faq" class="section alt">
      <h2>Gereelde Vrae</h2>
      <div id="faq-list" class="faq-list"></div>
    </section>

    <section id="rsvp" class="section">
      <h2 id="rsvp-heading">RSVP</h2>
      <p id="rsvp-intro" class="section-intro"></p>

      <div id="rsvp-closed-message" class="rsvp-closed" hidden></div>

      <div id="rsvp-search-step" class="rsvp-step">
        <label for="rsvp-name-input">Vind jou uitnodiging deur jou naam in te tik</label>
        <input type="text" id="rsvp-name-input" placeholder="bv. Jan Smit" autocomplete="off" />
        <div id="rsvp-search-results" class="rsvp-search-results"></div>
      </div>

      <form id="rsvp-form" class="rsvp-form" hidden>
        <h3 id="rsvp-form-party-label"></h3>
        <div id="rsvp-guest-list"></div>

        <label for="rsvp-song">Liedjie wat jou op die dansvloer sal kry</label>
        <input type="text" id="rsvp-song" />

        <label for="rsvp-message">Boodskap vir die paartjie (opsioneel)</label>
        <textarea id="rsvp-message" rows="3"></textarea>

        <button type="submit" class="btn btn-primary">Dien RSVP In</button>
        <button type="button" id="rsvp-back-btn" class="btn btn-link">Soek Weer</button>
      </form>

      <div id="rsvp-success" class="rsvp-success" hidden>
        <p>Dankie! Jou RSVP is ontvang. 💛</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p id="footer-hashtag"></p>
  </footer>

  <script src="/js/main.js"></script>
</body>
</html>
