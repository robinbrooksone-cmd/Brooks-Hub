<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Prop Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M8 21V11l8 10V11' stroke='%232fd07a' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='19' r='2.4' fill='%23f2b544'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --panel-2: #172030;
    --line: #223044;
    --ink: #e8eef6;
    --ink-dim: #8da2bb;
    --ink-faint: #5d7392;
    --hit: #2fd07a;
    --live: #f2b544;
    --miss: #f2555a;
    --pending: #4a5c76;
    --accent: #5aa9ff;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- header ---------- */

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(11,15,20,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 1080px; margin: 0 auto; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 17px; letter-spacing: .2px; font-weight: 650; }
  h1 span { color: var(--ink-faint); font-weight: 400; }
  .meta { color: var(--ink-dim); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1 1 auto; }

  button {
    font: inherit; font-size: 13px; font-weight: 550;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hit); display: inline-block; }
  .dot.stale { background: var(--live); }
  .dot.down { background: var(--miss); }

  .banner {
    margin: 12px 0 0; padding: 10px 13px; border-radius: 10px;
    font-size: 13px; border: 1px solid;
    background: rgba(242,181,68,.10); border-color: rgba(242,181,68,.35); color: #f6cf87;
  }
  .banner.err { background: rgba(242,85,90,.10); border-color: rgba(242,85,90,.35); color: #ffb3b6; }

  /* ---------- slip card ---------- */

  .slip {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); margin-top: 18px; overflow: hidden;
  }
  .slip-head {
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .slip-title { font-size: 16px; font-weight: 650; }
  .slip-sub { color: var(--ink-faint); font-size: 12.5px; margin-top: 3px; }

  .pill {
    font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; border: 1px solid;
  }
  .pill.alive { color: var(--live); border-color: rgba(242,181,68,.4); background: rgba(242,181,68,.10); }
  .pill.won   { color: var(--hit);  border-color: rgba(47,208,122,.4); background: rgba(47,208,122,.10); }
  .pill.dead  { color: var(--miss); border-color: rgba(242,85,90,.4);  background: rgba(242,85,90,.10); }

  .payout { text-align: right; }
  .payout .big { font-size: 21px; font-weight: 680; letter-spacing: -.3px; }
  .payout .small { color: var(--ink-faint); font-size: 12px; }

  .pips { display: flex; gap: 4px; flex-wrap: wrap; }
  .pip { width: 20px; height: 5px; border-radius: 3px; background: var(--pending); }
  .pip.hit { background: var(--hit); }
  .pip.live { background: var(--live); }
  .pip.miss { background: var(--miss); }
  .pip.unset { background: repeating-linear-gradient(45deg,#3a4a63,#3a4a63 3px,#22303f 3px,#22303f 6px); }

  .tally { font-size: 13px; color: var(--ink-dim); }
  .tally b { color: var(--ink); font-size: 15px; }

  /* ---------- legs ---------- */

  .leg {
    display: grid;
    grid-template-columns: 26px minmax(150px,1.5fr) minmax(96px,.9fr) 118px 1fr 86px;
    gap: 14px; align-items: center;
    padding: 12px 18px; border-top: 1px solid rgba(34,48,68,.55);
  }
  .leg:first-of-type { border-top: none; }
  .leg.hit { background: rgba(47,208,122,.055); }
  .leg.miss { background: rgba(242,85,90,.05); }
  .leg.unset { background: rgba(255,255,255,.02); }

  .idx { color: var(--ink-faint); font-size: 12px; text-align: right; }

  .who { min-width: 0; }
  .who .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .tm { color: var(--ink-faint); font-size: 11.5px; margin-top: 2px; }

  .prop { color: var(--ink-dim); font-size: 13px; }

  .val { text-align: right; white-space: nowrap; }
  .val .cur { font-size: 20px; font-weight: 680; letter-spacing: -.4px; }
  .val .of { color: var(--ink-faint); font-size: 13px; }
  .leg.hit .val .cur { color: var(--hit); }
  .leg.miss .val .cur { color: var(--miss); }
  .leg.pending .val .cur, .leg.unset .val .cur { color: var(--ink-faint); }

  .bar { height: 7px; background: #1b2534; border-radius: 4px; overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: var(--live); transition: width .5s ease; }
  .leg.hit  .bar i { background: var(--hit); }
  .leg.miss .bar i { background: var(--miss); }
  .leg.pending .bar i { background: var(--pending); }
  .game { color: var(--ink-faint); font-size: 11.5px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stat { text-align: right; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .stat.hit { color: var(--hit); }
  .stat.live { color: var(--live); }
  .stat.miss { color: var(--miss); }
  .stat.pending, .stat.unset { color: var(--ink-faint); font-weight: 500; }

  .warn { color: var(--live); font-size: 11.5px; margin-top: 3px; }

  /* ---------- games ---------- */

  details.games {
    margin-top: 22px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius);
  }
  details.games summary {
    padding: 13px 18px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink-dim);
  }
  details.games summary::marker { color: var(--ink-faint); }
  .game-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; padding: 4px 18px 18px;
  }
  .game-card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; }
  .game-card .row { display: flex; justify-content: space-between; font-size: 13.5px; }
  .game-card .row + .row { margin-top: 3px; }
  .game-card .st { color: var(--ink-faint); font-size: 11.5px; margin-top: 7px; }
  .game-card.in .st { color: var(--live); }

  .empty { color: var(--ink-faint); padding: 40px 0; text-align: center; }

  @media (max-width: 860px) {
    .leg { grid-template-columns: 22px 1fr 108px; grid-template-areas: "i w v" ". p s" ". b b"; row-gap: 8px; }
    .idx { grid-area: i; } .who { grid-area: w; } .val { grid-area: v; }
    .prop { grid-area: p; } .stat { grid-area: s; text-align: left; } .bar-wrap { grid-area: b; }
    .payout { text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div>
      <h1>NFL Prop Tracker <span id="weekLabel"></span></h1>
      <div class="meta">
        <span><span class="dot" id="healthDot"></span> <span id="updated">loading…</span></span>
        <span id="countdown"></span>
        <span id="loaded"></span>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="sortBtn">Sort: slip order</button>
    <button id="refreshBtn">Refresh</button>
  </div>
</header>

<div class="wrap">
  <div id="banner"></div>
  <div id="slips"><div class="empty">Loading slips…</div></div>
  <div id="games"></div>
</div>

<script>
(() => {
  'use strict';

  const POLL_FALLBACK = 30000;
  let pollMs = POLL_FALLBACK;
  let timer = null;
  let tickTimer = null;
  let nextPollAt = 0;
  let sortMode = 'slip';          // 'slip' | 'closest'
  let inFlight = false;

  const $ = (id) => document.getElementById(id);

  const fmtMoney = (n, cur) =>
    n == null ? '—' : cur + Number(n).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const fmtTime = (iso) => {
    if (!iso) return 'never';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  };

  const esc = (s) =>
    String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const STATUS_TEXT = {
    hit: 'HIT',
    live: 'live',
    miss: 'missed',
    pending: 'not started',
    unset: 'add leg',
  };

  /* ---------- rendering ---------- */

  function legStatusText(leg) {
    if (leg.status === 'hit') return 'HIT';
    if (leg.status === 'miss') return 'missed by ' + (leg.toGo ?? 0);
    if (leg.status === 'live') return leg.toGo + ' to go';
    if (leg.status === 'pending') return 'not started';
    return 'add leg';
  }

  function renderLeg(leg) {
    if (leg.placeholder) {
      return `
        <div class="leg unset">
          <div class="idx num">${leg.position}</div>
          <div class="who"><div class="nm">Leg ${leg.position} — not supplied</div>
            <div class="tm">${esc(leg.player)}</div></div>
          <div class="prop">—</div>
          <div class="val"><span class="cur">—</span></div>
          <div class="bar-wrap"><div class="bar"><i style="width:0%"></i></div></div>
          <div class="stat unset">add leg</div>
        </div>`;
    }

    const pct = Math.round((leg.pct || 0) * 100);
    const teamLine = [leg.team, leg.positionAbbr].filter(Boolean).join(' · ');
    const gameLine = leg.game
      ? `${esc(leg.game.score)} · ${esc(leg.game.detail)}`
      : 'game not found on this week’s scoreboard';
    // Distinguish "hasn't shown up yet" from "game over, never showed up".
    const noLineNote = !leg.noLine
      ? ''
      : leg.finished
        ? 'no stats recorded — inactive, or never touched the ball'
        : leg.status === 'live'
          ? 'no box-score line yet'
          : '';

    return `
      <div class="leg ${leg.status}">
        <div class="idx num">${leg.position}</div>
        <div class="who">
          <div class="nm">${esc(leg.player)}</div>
          <div class="tm">${esc(teamLine)}</div>
        </div>
        <div class="prop">${esc(leg.prop)}</div>
        <div class="val num">
          <span class="cur">${leg.value === null ? '—' : leg.value}</span>
          <span class="of"> / ${leg.line}</span>
        </div>
        <div class="bar-wrap">
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="game">${gameLine}</div>
          ${noLineNote ? `<div class="warn">${esc(noLineNote)}</div>` : ''}
        </div>
        <div class="stat ${leg.status} num">${esc(legStatusText(leg))}</div>
      </div>`;
  }

  function sortLegs(legs) {
    if (sortMode === 'slip') return legs;
    const rank = { live: 0, pending: 1, hit: 2, unset: 3, miss: 4 };
    return [...legs].sort((a, b) => {
      const r = (rank[a.status] ?? 9) - (rank[b.status] ?? 9);
      if (r !== 0) return r;
      return (b.pct ?? 0) - (a.pct ?? 0);
    });
  }

  function renderSlip(slip, currency) {
    const pips = slip.legs
      .map((l) => `<span class="pip ${l.placeholder ? 'unset' : l.status}" title="${esc(l.player)}"></span>`)
      .join('');

    const subBits = [
      slip.book,
      slip.stake != null ? fmtMoney(slip.stake, currency) + ' stake' : null,
      slip.odds != null ? slip.odds.toFixed(1) + ' odds' : null,
      slip.total + ' legs',
    ].filter(Boolean);

    return `
      <section class="slip">
        <div class="slip-head">
          <div>
            <div class="slip-title">${esc(slip.name)}</div>
            <div class="slip-sub">${esc(subBits.join(' · '))}</div>
          </div>
          <span class="pill ${slip.status}">${slip.status}</span>
          <div class="spacer"></div>
          <div>
            <div class="pips">${pips}</div>
            <div class="tally num" style="margin-top:7px"><b>${slip.hits}</b> / ${slip.total} legs hit${slip.misses ? ` · <span style="color:var(--miss)">${slip.misses} missed</span>` : ''}</div>
          </div>
          <div class="payout">
            <div class="big num">${slip.payout == null ? '—' : fmtMoney(slip.payout, currency)}</div>
            <div class="small">${slip.payout == null ? 'payout not recorded' : 'to pay'}</div>
          </div>
        </div>
        ${sortLegs(slip.legs).map(renderLeg).join('')}
      </section>`;
  }

  function renderGames(games) {
    if (!games || !games.length) return '';
    const cards = games
      .map((g) => `
        <div class="game-card ${g.state}">
          <div class="row"><span>${esc(g.away.abbr)}</span><span class="num">${g.away.score ?? ''}</span></div>
          <div class="row"><span>${esc(g.home.abbr)}</span><span class="num">${g.home.score ?? ''}</span></div>
          <div class="st">${esc(g.detail)}</div>
        </div>`)
      .join('');
    return `
      <details class="games">
        <summary>All games (${games.length})</summary>
        <div class="game-grid">${cards}</div>
      </details>`;
  }

  function render(data) {
    $('weekLabel').textContent =
      data.season && data.week ? `— ${data.season} week ${data.week}` : '';

    $('updated').textContent = 'updated ' + fmtTime(data.fetchedAt);
    $('loaded').textContent = data.boxScoresLoaded != null ? `${data.boxScoresLoaded} box scores` : '';

    const dot = $('healthDot');
    dot.className = 'dot' + (data.stale ? ' stale' : data.ok === false ? ' down' : '');

    const banners = [];
    if (data.stale) {
      banners.push(
        `<div class="banner">Showing last good data from ${fmtTime(data.fetchedAt)} — the most recent poll failed (${esc(data.error)}). Retrying.</div>`
      );
    }
    if (data.ok === false) {
      banners.push(`<div class="banner err">Couldn’t reach ESPN and there’s no cached data yet: ${esc(data.error)}</div>`);
    }
    if (data.fetchErrors && data.fetchErrors.length) {
      banners.push(
        `<div class="banner">Box score unavailable for ${data.fetchErrors.length} game(s): ${esc(data.fetchErrors.map((e) => e.game || e.eventId).join(', '))}</div>`
      );
    }
    $('banner').innerHTML = banners.join('');

    $('slips').innerHTML = (data.slips || []).length
      ? data.slips.map((s) => renderSlip(s, data.currency || 'R')).join('')
      : '<div class="empty">No slips configured. Add one to slips.json.</div>';

    $('games').innerHTML = renderGames(data.games);
  }

  /* ---------- polling ---------- */

  async function load() {
    if (inFlight) return;
    inFlight = true;
    $('refreshBtn').disabled = true;
    $('refreshBtn').textContent = 'Refreshing…';

    try {
      const res = await fetch('/api/state', { cache: 'no-store' });
      const data = await res.json();
      if (data.pollMs) pollMs = data.pollMs;
      render(data);
    } catch (err) {
      // The server is the thing that caches ESPN; if the server itself is
      // unreachable, leave whatever is on screen and just flag it.
      $('healthDot').className = 'dot down';
      $('banner').innerHTML =
        `<div class="banner err">Can’t reach the local server — is it still running? (${esc(err.message)})</div>`;
    } finally {
      inFlight = false;
      $('refreshBtn').disabled = false;
      $('refreshBtn').textContent = 'Refresh';
      schedule();
    }
  }

  function schedule() {
    clearTimeout(timer);
    nextPollAt = Date.now() + pollMs;
    timer = setTimeout(load, pollMs);
  }

  function tick() {
    const left = Math.max(0, Math.round((nextPollAt - Date.now()) / 1000));
    $('countdown').textContent = nextPollAt ? `next in ${left}s` : '';
  }

  $('refreshBtn').addEventListener('click', load);

  $('sortBtn').addEventListener('click', () => {
    sortMode = sortMode === 'slip' ? 'closest' : 'slip';
    $('sortBtn').textContent = 'Sort: ' + (sortMode === 'slip' ? 'slip order' : 'closest first');
    load();
  });

  // Catch up immediately when the tab comes back rather than waiting out the timer.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && Date.now() > nextPollAt) load();
  });

  tickTimer = setInterval(tick, 1000);
  load();
})();
</script>
</body>
</html>
